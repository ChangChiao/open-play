<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雙打配對</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef5f0; --card:#ffffff; --fg:#14221b; --muted:#5f6f66; --line:#dbe7df;
    --court1:#0f766e; --court2:#15803d; --accent:#0f766e; --accent-fg:#fff;
    --team-a:#e0f2fe; --team-a-fg:#075985; --team-b:#ffe4e6; --team-b-fg:#9f1239;
    --done:#dcfce7; --done-line:#4ade80; --shadow:0 1px 2px rgba(16,40,30,.06), 0 8px 24px rgba(16,40,30,.08);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0b1310; --card:#14201b; --fg:#e6f0ea; --muted:#93a59b; --line:#24352d;
    --court1:#115e59; --court2:#166534; --accent:#2dd4bf; --accent-fg:#06201a;
    --team-a:#0c2a3d; --team-a-fg:#7dd3fc; --team-b:#3a1420; --team-b-fg:#fda4af;
    --done:#10291b; --done-line:#22c55e; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 "Noto Sans TC", system-ui, "PingFang TC", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:0 16px 48px; }
  .hero { position:relative; overflow:hidden; margin:16px 0 20px; padding:28px 24px; border-radius:20px; color:#fff;
    background:linear-gradient(135deg, var(--court1), var(--court2)); box-shadow:var(--shadow); }
  /* 球場線 */
  .hero::before { content:""; position:absolute; inset:14px; border:2px solid rgba(255,255,255,.35); border-radius:6px; pointer-events:none; }
  .hero h1 { position:relative; z-index:1; margin:0; font-size:clamp(28px, 7vw, 40px); font-weight:900; letter-spacing:.04em; }
  .hero p { position:relative; z-index:1; margin:4px 0 0; opacity:.85; }
  .panel { background:var(--card); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  label { display:block; font-weight:700; font-size:14px; color:var(--muted); }
  textarea, input { display:block; width:100%; margin-top:6px; font:inherit; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px;
    background:var(--bg); color:var(--fg); transition:border-color .15s, box-shadow .15s; }
  textarea:focus, input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  textarea { height:140px; resize:vertical; }
  button { font:inherit; font-weight:700; padding:9px 16px; border:0; border-radius:999px; background:var(--accent); color:var(--accent-fg);
    cursor:pointer; transition:transform .1s, filter .15s, box-shadow .15s; white-space:nowrap; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:scale(.96); }
  #go, #again { padding:12px 24px; font-size:17px; box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
  #again { display:block; margin:24px auto 0; }
  .row { display:flex; gap:12px; align-items:end; margin-top:14px; flex-wrap:wrap; }
  .row label { flex:1; min-width:120px; }
  .summary { margin:20px 4px 8px; }
  .round { background:var(--card); border:2px solid transparent; border-radius:16px; padding:14px 16px; margin:14px 0; box-shadow:var(--shadow);
    transition:background .25s, border-color .25s; }
  .round h3 { margin:0 0 4px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge { font-size:15px; font-weight:900; padding:4px 12px; border-radius:999px; background:var(--fg); color:var(--card); }
  .actions { display:flex; gap:8px; }
  .actions button { padding:7px 14px; font-size:14px; }
  .match { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:10px 0; border-top:1px dashed var(--line); }
  .match:first-of-type { border-top:0; }
  .court { grid-column:1 / -1; font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--muted); }
  .team { padding:10px 12px; border-radius:12px; text-align:center; font-weight:700; font-size:17px; word-break:break-all; }
  .team small { display:block; font-weight:500; font-size:12px; opacity:.7; }
  .team.a { background:var(--team-a); color:var(--team-a-fg); }
  .team.b { background:var(--team-b); color:var(--team-b-fg); }
  .vs { width:40px; height:40px; display:grid; place-items:center; border-radius:50%; font-weight:900; font-size:13px; font-style:italic;
    background:linear-gradient(135deg, #f59e0b, #ef4444); color:#fff; box-shadow:0 4px 10px rgba(239,68,68,.35); }
  .resting { margin-top:6px; }
  .round.done { background:var(--done); border-color:var(--done-line); }
  .round.done .team { opacity:.75; }
  .done-btn { background:#facc15; color:#1d2330; }
  .muted { color:var(--muted); font-size:14px; }
  .warn { color:#b45309; background:#fef3c7; padding:8px 12px; border-radius:10px; font-size:14px; }
  @media (prefers-color-scheme: dark) { .warn { color:#fcd34d; background:#3a2a07; } }
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>🏸 雙打配對</h1>
    <p>每個人都跟不同的人搭檔一次</p>
  </header>
  <section class="panel">
    <label>人名（換行、逗號或空白分隔）<textarea id="names" placeholder="小明&#10;小華&#10;阿美&#10;阿傑&#10;..."></textarea></label>
    <div class="row">
      <label>場地數<input id="courts" type="number" min="1" value="1"></label>
      <button id="go">產生賽程</button>
    </div>
  </section>
  <div id="out"></div>
</main>
<script>
// 每一對搭檔恰好一次；每輪貪婪挑「休息最久、剩餘搭檔最多」的人上場，隨機重試取最佳。
// ponytail: 隨機重試 + 貪婪，不保證最佳解；人數 ~20 以內很夠用。
function attempt(n, allPairs, courts) {
  let left = allPairs.slice();
  const rest = Array(n).fill(0), play = Array(n).fill(0), remain = Array(n).fill(n - 1), rounds = [];
  let maxRest = 0, maxPlay = 0;
  while (left.length >= 2) {
    const ranked = left
      .map(p => ({ p, w: 3 * (rest[p[0]] ** 2 + rest[p[1]] ** 2) + remain[p[0]] + remain[p[1]] + Math.random() * 10
        - 40 * ((play[p[0]] >= 2) + (play[p[1]] >= 2)) })) // 已連打 2 輪的人盡量排休
      .sort((a, b) => b.w - a.w);
    const used = new Set(), chosen = [];
    // 第一趟跳過已連打 2 輪的人，不夠再補
    for (const tired of [false, true]) for (const { p } of ranked) {
      if (chosen.length === 2 * courts) break;
      if (used.has(p[0]) || used.has(p[1])) continue;
      if (!tired && (play[p[0]] >= 2 || play[p[1]] >= 2)) continue;
      chosen.push(p); used.add(p[0]); used.add(p[1]);
    }
    if (chosen.length % 2) { const p = chosen.pop(); used.delete(p[0]); used.delete(p[1]); }
    if (!chosen.length) break; // 剩下的搭檔都撞人，排不出對戰
    const matches = [];
    for (let i = 0; i < chosen.length; i += 2) matches.push([chosen[i], chosen[i + 1]]);
    left = left.filter(p => !chosen.includes(p));
    for (const p of chosen) { remain[p[0]]--; remain[p[1]]--; }
    const resting = [];
    for (let i = 0; i < n; i++) {
      if (used.has(i)) { rest[i] = 0; play[i]++; maxPlay = Math.max(maxPlay, play[i]); }
      else { play[i] = 0; rest[i]++; resting.push(i); if (remain[i] > 0) maxRest = Math.max(maxRest, rest[i]); }
    }
    rounds.push({ matches, resting });
  }
  const over = Math.max(0, maxRest - 2) + Math.max(0, maxPlay - 2);
  return { rounds, left, maxRest, maxPlay, score: left.length * 10000 + over * 1000 + (maxRest + maxPlay) * 10 + rounds.length };
}

function schedule(n, courts, tries = 3000) {
  const pairs = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) pairs.push([i, j]);
  let best = null;
  for (let t = 0; t < tries; t++) {
    const r = attempt(n, pairs, courts);
    if (!best || r.score < best.score) best = r;
  }
  return best;
}

function say(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW'; u.rate = 0.9;
  speechSynthesis.speak(u);
}

const $ = id => document.getElementById(id);
$('go').onclick = () => {
  const names = [...new Set($('names').value.split(/[\s,，、]+/).filter(Boolean))];
  const courts = Math.max(1, parseInt($('courts').value) || 1);
  const out = $('out');
  if (names.length < 4) { out.innerHTML = '<p class="warn">至少要 4 個人。</p>'; return; }
  const r = schedule(names.length, courts);
  const nm = i => names[i];
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let html = `<p class="muted summary">${names.length} 人，共 ${r.rounds.length} 輪；最長連續休息 ${r.maxRest} 輪（已打完所有搭檔的人不計）、最長連續上場 ${r.maxPlay} 輪。</p>`;
  if (r.maxPlay > 2) html += `<p class="warn">有人得連打 ${r.maxPlay} 輪。` + (names.length < 6 * courts
    ? `每輪上場 ${4 * courts} 人，要讓人不連打 3 輪，${courts} 個場地至少需要 ${6 * courts} 人${courts > 1 ? '，或減少場地數' : ''}。`
    : `這個人數剛好卡在邊界，排不出完美的，已取最接近的結果；可以再按一次「產生賽程」試試。`) + `</p>`;
  if (r.maxRest > 2) html += `<p class="warn">這個人數／場地數下排不出「休息不超過兩輪」，已取最接近的結果。</p>`;
  if (r.left.length) html += `<p class="warn">未排到的搭檔：${r.left.map(p => esc(nm(p[0]) + '＋' + nm(p[1]))).join('、')}（人數不是 4 的倍數或 4 的倍數+1 時，搭檔總數無法剛好湊成對戰）</p>`;
  r.rounds.forEach((rd, k) => {
    const speech = `第${k + 1}輪。` + rd.matches.map(([a, b], c) =>
      `${courts > 1 ? `第${c + 1}場地，` : ''}${nm(a[0])}和${nm(a[1])}，對戰，${nm(b[0])}和${nm(b[1])}。`).join('');
    html += `<div class="round"><h3><span class="badge">第 ${k + 1} 輪</span><span class="actions"><button data-say="${esc(speech)}">🔊 唱名</button><button class="done-btn">✓ 比賽完成</button></span></h3>` +
      rd.matches.map(([a, b], c) => `<div class="match">${courts > 1 ? `<div class="court">場地 ${c + 1}</div>` : ''}` +
        `<div class="team a">${esc(nm(a[0]))}、${esc(nm(a[1]))}<small>一組</small></div><div class="vs">VS</div>` +
        `<div class="team b">${esc(nm(b[0]))}、${esc(nm(b[1]))}<small>一組</small></div></div>`).join('') +
      (rd.resting.length ? `<div class="muted resting">😴 休息：${rd.resting.map(i => esc(nm(i))).join('、')}</div>` : '') + '</div>';
  });
  html += '<button id="again">🔄 新的一輪</button>';
  out.innerHTML = html;
};
$('out').onclick = e => {
  const t = e.target.closest('[data-say]'); if (t) say(t.dataset.say);
  if (e.target.id === 'again') { $('go').click(); scrollTo({ top: 0, behavior: 'smooth' }); }
  const d = e.target.closest('.done-btn');
  if (d) d.textContent = d.closest('.round').classList.toggle('done') ? '↺ 取消完成' : '✓ 比賽完成';
};
</script>
</body>
</html>
